name: Verify the case
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --locked --extra report
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked sqlfluff lint sql
      - run: uv run --locked coverage run -m unittest discover -s tests -v
      - run: uv run --locked coverage run --append -m harbor_pulse demo
      - run: uv run --locked python scripts/check_evidence.py
      - run: uv run --locked python scripts/practice_demo.py
      - run: uv run --locked python scripts/audit_case.py
      - run: uv run --locked python scripts/check_report_accessibility.py
      - run: uv run --locked coverage run --append scripts/challenge_evidence.py
      - run: uv run --locked coverage run --append scripts/review_evidence.py
      - run: uv run --locked coverage report
      - run: uv run --locked coverage xml
      - run: uv run --locked coverage html
      - run: uv run --locked python scripts/build_native_model.py
      - run: sqlite3 build/run/warehouse.sqlite < sql/reviewer_queries.sql
      - run: uv run --locked python scripts/build_report.py
      - run: uv run --locked python scripts/validate_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-synthetic-evidence
          path: |
            build/coverage/
            build/case-consistency.json
            build/practice-reference.json
            build/run/summary.json
            build/run/loads.json
            build/run/associations.json
            build/run/decisions.json
            build/run/pilot.json
          retention-days: 14
  clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
      - run: uv sync --locked --extra report
      - run: uv run --locked python scripts/check_clean_clone.py
      - uses: actions/upload-artifact@v4
        with:
          name: clean-checkout-proof
          path: build/clean-clone.json
          retention-days: 14
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          printf '%s\n' "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: gitleaks git --redact --no-banner
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-qa
          path: |
            playwright-report/
            test-results/
          retention-days: 14
