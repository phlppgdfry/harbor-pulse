name: Verify the case
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m harbor_pulse demo
      - run: python scripts/check_evidence.py
      - run: python -m pip install 'jsonschema>=4.23,<5'
      - run: python scripts/build_report.py
      - run: python scripts/validate_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evidence
          path: |
            build/run/summary.json
            build/run/loads.json
            build/run/associations.json
            build/run/decisions.json
            build/run/pilot.json
          retention-days: 14
